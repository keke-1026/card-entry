<!DOCTYPE html>
<html lang="ja" data-theme="morning">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エントリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
<style>
  @property --bg { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
  @property --ink { syntax: "<color>"; inherits: true; initial-value: #1c1f26; }
  @property --mute { syntax: "<color>"; inherits: true; initial-value: #7a8190; }
  @property --line { syntax: "<color>"; inherits: true; initial-value: #e3e6ee; }
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #4f7cff; }
  @property --accent2 { syntax: "<color>"; inherits: true; initial-value: #8fb0ff; }
  :root { --bg: #ffffff; --ink: #1c1f26; --mute: #7a8190; --line: #e3e6ee; --accent: #4f7cff; --accent2: #8fb0ff; --dur: 320ms; --step: 35ms; transition: --bg 2s ease, --ink 2s ease, --mute 2s ease, --line 2s ease, --accent 2s ease, --accent2 2s ease; }
  :root[data-theme="night"] { --bg: #0f1420; --ink: #e9edf7; --mute: #8b94aa; --line: #232b3f; --accent: #7fa2ff; --accent2: #4a67c9; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-weight: 300; font-synthesis: none; }
  button { font: inherit; font-weight: 300; color: inherit; }
  b { font-weight: 300; }
  .none { display: none !important; }

  #bg { position: fixed; inset: 0; background: repeating-linear-gradient(115deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 2px, transparent 2px 64px); animation: drift 40s linear infinite; }
  @keyframes drift { to { background-position: 640px 0; } }

  .scene { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vmin; }
  .scene.active { display: flex; }

  .rise { opacity: 0; animation: rise .7s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(3vmin); } to { opacity: 1; transform: none; } }
  .chars span { display: inline-block; opacity: 0; animation: charIn .6s cubic-bezier(.2, .9, .2, 1) forwards; animation-delay: calc(var(--d, 0ms) + var(--i) * 55ms); }
  @keyframes charIn { from { opacity: 0; transform: translateY(60%) scale(.9); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .rule { height: 1px; width: 0; background: var(--ink); margin: 3vmin auto; animation: rule .9s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rule { to { width: 40vmin; } }

  .label { font-size: 3.6vmin; letter-spacing: .5em; padding-left: .5em; color: var(--accent); margin-bottom: 2vmin; }
  .name { font-size: 12vmin; line-height: 1.25; max-width: 92vw; word-break: break-all; }
  .ask { font-size: 5vmin; margin-top: 1vmin; }
  .lbl { font-size: 3vmin; color: var(--mute); margin-top: 1.5vmin; }
  .note { font-size: 3.2vmin; color: var(--mute); margin-top: 3vmin; }

  .title-badge { position: relative; display: inline-block; overflow: hidden; font-size: 3.8vmin; letter-spacing: .3em; padding: .9vmin 3vmin .9vmin calc(3vmin + .3em); margin-bottom: 2.4vmin; border: 1px solid var(--accent); border-radius: 10vmin; color: var(--accent); }
  .title-badge.promo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .65) 50%, transparent 65%); background-size: 260% 100%; background-position: 160% 0; animation: sweep 1.6s ease 1s 2 both; }
  @keyframes sweep { from { background-position: 160% 0; } to { background-position: -60% 0; } }
  .promo-label { font-size: 3vmin; letter-spacing: .4em; padding-left: .4em; color: var(--mute); margin-bottom: 1.4vmin; }

  #idle-date { font-size: 4.2vmin; color: var(--mute); letter-spacing: .2em; }
  #clock { font-size: 22vmin; line-height: 1.1; letter-spacing: .02em; }
  .colon { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .pulse { display: inline-block; font-size: 4vmin; letter-spacing: .2em; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .tapicon { position: relative; width: 22vmin; height: 22vmin; margin: 4vmin 0 3vmin; }
  .reader { position: absolute; left: 0; right: 0; bottom: 0; height: 2.4vmin; border-radius: 1.2vmin; background: var(--ink); }
  .cardico { position: absolute; left: 50%; top: 0; width: 14vmin; height: 9vmin; margin-left: -7vmin; border-radius: 1.4vmin; border: .35vmin solid var(--ink); background: var(--bg); animation: tap 2.8s ease-in-out infinite; }
  .cardico::after { content: ""; position: absolute; left: 1.6vmin; top: 2vmin; width: 4vmin; height: 3vmin; border-radius: .6vmin; background: var(--accent2); }
  @keyframes tap { 0%, 15% { transform: translateY(0) rotate(-6deg); } 45%, 60% { transform: translateY(9vmin) rotate(0deg); } 100% { transform: translateY(0) rotate(-6deg); } }

  .btns { margin-top: 5vmin; display: flex; align-items: center; justify-content: center; }
  .btn { border: 0; cursor: pointer; border-radius: 10vmin; }
  .btn.main { font-size: 5vmin; padding: 2vmin 10vmin; background: var(--ink); color: var(--bg); transition: transform .15s, opacity .3s; animation: glow 2s ease-out infinite; }
  .btn.main:active, .btn.pressed { transform: scale(.95); }
  .btn.main:disabled { opacity: .5; animation: none; }
  .btn.sub { font-size: 3.6vmin; padding: 1.6vmin 6vmin; margin-left: 3vmin; background: transparent; border: 1px solid var(--line); color: var(--mute); transition: transform .15s, opacity .3s; }
  .btn.sub:disabled { opacity: .4; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 4vmin color-mix(in srgb, var(--accent) 0%, transparent); } }

  .nudge { font-size: 6vmin; animation: nudge .6s ease .2s both; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-1.4vmin); } 40% { transform: translateX(1.4vmin); } 60% { transform: translateX(-.8vmin); } 80% { transform: translateX(.8vmin); } }
  .reg { display: flex; gap: 8vmin; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4vmin; }
  .code { font-size: 18vmin; line-height: 1.1; color: var(--accent); }
  .code span { margin: 0 .5vmin; }
  #r-qr { width: 29vmin; height: 29vmin; padding: 2vmin; border: 1px solid var(--line); background: #fff; margin: 0 auto; }
  #r-qr svg { width: 100%; height: 100%; display: block; }

  #e-date { font-size: 4vmin; color: var(--mute); }
  #e-time { font-size: 10vmin; letter-spacing: .05em; margin-top: 1vmin; }
  .total { display: flex; align-items: baseline; justify-content: center; gap: 2vmin; margin-top: 3vmin; font-size: 4.2vmin; }
  .total b { font-size: 13vmin; color: var(--accent); min-width: 1ch; }

  .check { width: 16vmin; margin: 3vmin 0; fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .check path { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .7s ease .2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .o-sub { font-size: 3.6vmin; color: var(--mute); letter-spacing: .2em; margin-bottom: 2vmin; }
  .o-stage { position: relative; width: 70vmin; height: 64vmin; margin-top: 1vmin; }
  .o-holder { position: absolute; left: 50%; bottom: 0; width: 16vmin; height: 32vmin; margin-left: -8vmin; transform-origin: 50% 100%; transition: opacity .6s ease, transform .6s ease; }
  .o-box { position: absolute; inset: 0; z-index: 2; border-radius: 1.6vmin; background: var(--accent); }
  .o-box::before { content: ""; position: absolute; left: 2.4vmin; right: 2.4vmin; top: 0; height: 1.4vmin; border-radius: 0 0 1vmin 1vmin; background: var(--bg); opacity: .55; }
  .o-box::after { content: "おみくじ"; position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); writing-mode: vertical-rl; font-size: 4vmin; letter-spacing: .3em; color: var(--bg); }
  .o-stick { position: absolute; left: 50%; bottom: 2vmin; width: 3.8vmin; height: 27vmin; margin-left: -1.9vmin; z-index: 1; border: 1px solid var(--ink); border-radius: .6vmin; background: color-mix(in srgb, var(--bg) 90%, var(--accent)); }
  #o-no { position: absolute; top: 1.2vmin; left: 0; right: 0; text-align: center; writing-mode: vertical-rl; font-size: 2.4vmin; letter-spacing: .1em; color: var(--ink); }
  .shake .o-holder { animation: shake 1.9s ease-in-out; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 8% { transform: rotate(-16deg) translateX(-1vmin); } 18% { transform: rotate(14deg) translateX(1vmin); } 30% { transform: rotate(-18deg) translateX(-1vmin); } 42% { transform: rotate(16deg) translateX(1vmin); } 56% { transform: rotate(-12deg); } 70% { transform: rotate(10deg); } 84% { transform: rotate(-5deg); } }
  .stick .o-stick { animation: stickUp .9s cubic-bezier(.2, .9, .3, 1.15) forwards; }
  @keyframes stickUp { from { transform: translateY(0); } to { transform: translateY(-20vmin); } }
  .paper .o-holder { opacity: 0; transform: translateY(5vmin) scale(.92); }

  .o-paper { position: absolute; left: 50%; top: 0; width: 52vmin; margin-left: -26vmin; padding: 4.4vmin 4vmin 4vmin; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 2vmin 6vmin rgba(0, 0, 0, .16); clip-path: inset(-10vmin -10vmin 100% -10vmin); opacity: 0; overflow: hidden; }
  .paper .o-paper { opacity: 1; animation: unroll 1s cubic-bezier(.3, .7, .2, 1) forwards; }
  @keyframes unroll { from { clip-path: inset(-10vmin -10vmin 100% -10vmin); } to { clip-path: inset(-10vmin -10vmin -10vmin -10vmin); } }
  .o-head { font-size: 3.2vmin; letter-spacing: .5em; padding-left: .5em; color: var(--mute); }
  .o-num { font-size: 3vmin; color: var(--mute); margin-top: 1vmin; }
  .o-rank { font-size: 19vmin; line-height: 1.1; margin: 2.6vmin 0 1.4vmin; opacity: 0; }
  .o-rank[data-rank="大吉"], .o-rank[data-rank="中吉"] { color: var(--accent); }
  .o-rank[data-rank="凶"] { color: var(--mute); }
  .result .o-rank { animation: stamp .75s cubic-bezier(.2, 1.4, .3, 1) both; }
  @keyframes stamp { 0% { opacity: 0; transform: scale(2.6) rotate(-8deg); filter: blur(6px); } 60% { opacity: 1; transform: scale(.93) rotate(1deg); filter: blur(0); } 100% { opacity: 1; transform: none; } }
  .o-line { height: 1px; width: 0; margin: 2vmin auto; background: var(--ink); }
  .result .o-line { animation: rule .8s ease .5s forwards; }
  .o-msg, .o-lucky { opacity: 0; }
  .o-msg { font-size: 3.6vmin; line-height: 1.7; }
  .o-lucky { font-size: 3vmin; color: var(--mute); margin-top: 2.4vmin; }
  .result .o-msg { animation: rise .8s ease .7s forwards; }
  .result .o-lucky { animation: rise .8s ease 1.2s forwards; }
  .result .o-paper::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .5) 50%, transparent 65%); background-size: 260% 100%; animation: sweep 1.4s ease .2s 1 both; }
  .result .o-paper { animation: unroll 1s cubic-bezier(.3, .7, .2, 1) forwards, flash 1s ease .1s both; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); } 100% { background: var(--bg); } }

  #cd { position: fixed; right: 3.4vmin; top: 3vmin; z-index: 20; display: flex; align-items: baseline; gap: 1.2vmin; font-size: 3.2vmin; color: var(--mute); opacity: 0; transform: translateY(-1.5vmin); transition: opacity .4s, transform .4s, color .4s; pointer-events: none; }
  #cd.on { opacity: 1; transform: none; }
  #cd.warn { color: var(--accent); }
  #cd-num { position: relative; display: inline-block; width: 4.0ch; height: 1.25em; overflow: hidden; font-size: 1.6em; line-height: 1.25; font-variant-numeric: tabular-nums; text-align: right; }
  #cd-num .r { position: absolute; left: 0; right: 0; top: 0; animation: rollIn .4s cubic-bezier(.65, 0, .35, 1) both; }
  #cd-num .r.old { animation: rollOut .4s cubic-bezier(.65, 0, .35, 1) both; }
  @keyframes rollIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes rollOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }

  #popup { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(6px); }
  #popup.on { display: flex; animation: fadeIn .25s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .pop-card { min-width: 56vmin; max-width: 88vw; padding: 6vmin 8vmin; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 3vmin; box-shadow: 0 2vmin 8vmin rgba(0, 0, 0, .18); animation: popIn .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  @keyframes popIn { from { transform: translateY(4vmin) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .pop-title { font-size: 6vmin; color: var(--accent); }
  .pop-body { font-size: 3.6vmin; color: var(--mute); margin-top: 2vmin; line-height: 1.6; }

  #confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: -5vh; display: block; border-radius: 1px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--x), 112vh, 0) rotate(var(--r)); } }

  #cover { position: fixed; inset: 0; z-index: 50; display: flex; pointer-events: none; }
  #cover .stripe { flex: 1; background: var(--accent); transform: scaleY(0); transform-origin: top; }
  #cover .stripe:nth-child(even) { background: var(--accent2); }
  #cover.in .stripe { animation: coverIn var(--dur) cubic-bezier(.77, 0, .18, 1) forwards; animation-delay: calc(var(--i) * var(--step)); }
  #cover.out .stripe { transform: scaleY(1); transform-origin: bottom; animation: coverOut var(--dur) cubic-bezier(.77, 0, .18, 1) forwards; animation-delay: calc(var(--i) * var(--step)); }
  @keyframes coverIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes coverOut { from { transform: scaleY(1); } to { transform: scaleY(0); } }

  #testPanel { position: fixed; right: 10px; bottom: 14px; z-index: 60; display: none; flex-wrap: wrap; gap: 6px; max-width: 60vw; justify-content: flex-end; }
  #testPanel.on { display: flex; }
  #testPanel button { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
</style>
</head>
<body>
<div id="bg"></div>

<section class="scene active" id="s-idle">
  <div class="rise" style="--d:0ms"><div id="idle-date"></div></div>
  <div class="rise" style="--d:100ms"><div id="clock"><span id="hh"></span><span class="colon">:</span><span id="mm"></span></div></div>
  <div class="tapicon rise" style="--d:250ms"><div class="reader"></div><div class="cardico"></div></div>
  <div class="rise" style="--d:400ms"><span class="pulse" id="hint">画面をタップしてください</span></div>
</section>

<section class="scene" id="s-confirm">
  <div class="label rise" style="--d:0ms">ようこそ</div>
  <div class="title-badge rise" id="c-title" style="--d:120ms"></div>
  <div class="name chars" id="c-name" style="--d:220ms"></div>
  <div class="rule" style="--d:560ms"></div>
  <div class="ask rise" style="--d:760ms">エントリーしますか？</div>
  <div class="btns rise" style="--d:940ms">
    <button class="btn main" id="btn-entry">エントリー</button><button class="btn sub" id="btn-cancel">いいえ</button>
  </div>
</section>

<section class="scene" id="s-register">
  <div class="nudge">登録されていません</div>
  <div class="reg">
    <div class="rise" style="--d:300ms">
      <div class="lbl">アクセスコード</div>
      <div class="code chars" id="r-code" style="--d:500ms"></div>
    </div>
    <div class="rise" style="--d:600ms">
      <div id="r-qr"></div>
      <div class="lbl">QRコードを読み取って登録</div>
    </div>
  </div>
  <div class="note rise" style="--d:1000ms">Discordコマンドの /card でも登録できます</div>
</section>

<section class="scene" id="s-entered">
  <div class="label rise" style="--d:0ms">エントリー完了</div>
  <div class="promo-label rise" id="e-promo" style="--d:150ms">称号を獲得</div>
  <div class="title-badge rise" id="e-title" style="--d:250ms"></div>
  <div class="name chars" id="e-name" style="--d:350ms"></div>
  <div class="rule" style="--d:750ms"></div>
  <div class="rise" style="--d:900ms"><div id="e-date"></div></div>
  <div class="rise" style="--d:1050ms"><div id="e-time"></div></div>
  <div class="total rise" style="--d:1250ms"><span>総エントリー数</span><b id="e-count">0</b><span>回</span></div>
  <div class="note rise" id="e-omi" style="--d:1600ms"></div>
</section>

<section class="scene" id="s-registered">
  <div class="label rise" style="--d:0ms">登録完了</div>
  <svg class="check" viewBox="0 0 52 40"><path d="M6 21 L20 35 L46 5"/></svg>
  <div class="name chars" id="g-name" style="--d:400ms"></div>
  <div class="ask rise" style="--d:800ms">登録しました</div>
  <div class="note rise" style="--d:1200ms">続けてエントリーします</div>
</section>

<section class="scene" id="s-omikuji">
  <div class="label rise" style="--d:0ms"></div>
  <div class="o-sub rise" id="o-sub" style="--d:150ms"></div>
  <div class="o-stage">
    <div class="o-holder">
      <div class="o-stick"><span id="o-no"></span></div>
      <div class="o-box"></div>
    </div>
    <div class="o-paper">
      <div class="o-head">本日のおみくじ</div>
      <div class="o-num" id="o-num"></div>
      <div class="o-rank" id="o-rank"></div>
      <div class="o-line"></div>
      <div class="o-msg" id="o-msg"></div>
      <div class="o-lucky" id="o-lucky"></div>
    </div>
  </div>
</section>

<div id="cd"><span>のこり</span><span id="cd-num"></span><span>秒</span></div>
<div id="popup"><div class="pop-card"><div class="pop-title" id="pop-title"></div><div class="pop-body" id="pop-body"></div></div></div>
<div id="confetti"></div>
<div id="cover"></div>

<div id="testPanel">
  <button id="t-confirm">確認</button>
  <button id="t-register">未登録</button>
  <button id="t-entered">完了</button>
  <button id="t-entered2">引き済み</button>
  <button id="t-registered">登録</button>
  <button id="t-morning">朝</button>
  <button id="t-night">夜</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">

const q = new URLSearchParams(location.search);
const num = (k, d) => {
  const v = parseFloat(q.get(k));
  return Number.isFinite(v) ? v : d;
};

const WORKER = "https://entry.keikeiy1026-e69.workers.dev";
const FILES = { bgm: "bgm.m4a", entry: "entry.wav", timeout: "", click: "click.mp3" };
const BGM_VOLUME = 0.6;
const FADE_IN = 1.2;
const FADE_OUT = 1.6;
const LOOP_BACK_TO = num("loopStart", 0);
const LOOP_CUT_END = num("loopCut", 0);
const MORNING_FROM = num("morningFrom", 6);
const NIGHT_FROM = num("nightFrom", 18);
const TIMEOUT = {

  entered: 9000,

};

const TITLES = [

  [30, "友達"], [50, "めちゃ友達"], [75, "親友"], [100, "親友の中の親友"], [150, "神"], [200, "殿堂入り"]
];
function titleOf(count) {
  let t = "";
  for (const [n, name] of TITLES) if (count >= n) t = name;
  return t;
}

const GOOD = ["大吉", "中吉"];
const MSG = {
  "大吉": ["なにやってもうまくいくかもね!", "今日は思い切って重いことを進めよう!", "ゲームでうまくいくかも!"],
  "中吉": ["落ち着いて進めれば、うまくいく!", "小さな幸運が振ってくるよ!", "今日は冒険しよう"],
  "小吉": [ "今日は寝るといいことがあるよ!", "身の回りの人とお話してみよう!"],
  "吉": ["いつも通りが一番。穏やかに過ごせます", "急がず、ひとつずつ進めれば大丈夫!"],
"末吉": ["あせらないで!きっと明日にはいいことがあるよ!", "今日は早めに休もう!"]
};
const LUCKY = ["1+1", "1×3+3÷3", "20×20", "114×514", "810×810×114514", "1+2", "るーと4", "500513+11", "ばなな (?)", "1+1+1+1+1", "2×2×2", "3×3×3", "4×4×4", "5×5×5", "6×6×6", "7×7×7", "8×8×8", "9×9×9", "10×10×10"];

const app = initializeApp({

const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const scenes = {
  idle: $("s-idle"),
  confirm: $("s-confirm"),
  register: $("s-register"),
  entered: $("s-entered"),

  omikuji: $("s-omikuji")
};
const cover = $("cover");
const hint = $("hint");
const btnEntry = $("btn-entry");
const btnCancel = $("btn-cancel");
let state = "idle";

for (let i = 0; i < STRIPES; i++) {

  s.style.setProperty("--i", i);

function themeOf(h) {
  return h >= MORNING_FROM && h < NIGHT_FROM ? "morning" : "night";
}
function applyTheme() {
  document.documentElement.dataset.theme = q.get("theme") || themeOf(new Date().getHours());
}
applyTheme();
setInterval(applyTheme, 30000);

const AC = window.AudioContext || window.webkitAudioContext;
const ac = new AC();
const master = ac.createGain();
master.gain.value = 1;
master.connect(ac.destination);
const buffers = {};
let noiseBuf = null;

async function loadBuffer(url) {
  if (!url) return null;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await ac.decodeAudioData(await r.arrayBuffer());
  } catch (e) {
    return null;
  }
}
Object.entries(FILES).forEach(async ([k, u]) => {
  buffers[k] = await loadBuffer(u);
});

function tone(freq, start, dur, type = "sine", vol = 0.18) {
  const t = ac.currentTime + start;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(start, dur, vol = 0.1, freq = 2000) {
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime + start;
  const s = ac.createBufferSource();
  const f = ac.createBiquadFilter();
  const g = ac.createGain();
  s.buffer = noiseBuf;
  f.type = "bandpass";
  f.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f);
  f.connect(g);
  g.connect(master);
  s.start(t);
  s.stop(t + dur + 0.02);
}

function playBuf(name) {
  const b = buffers[name];
  if (!b) return false;
  const s = ac.createBufferSource();
  s.buffer = b;
  s.connect(master);
  s.start();
  return true;
}

const SFX = {
  click() { if (!playBuf("click")) tone(880, 0, 0.07, "triangle", 0.14); },
  timeout() {
    if (playBuf("timeout")) return;
    tone(520, 0, 0.18, "sine", 0.2);
    tone(390, 0.2, 0.18, "sine", 0.2);
    tone(260, 0.4, 0.35, "sine", 0.22);
  },
  entry() {
    if (playBuf("entry")) return;
    tone(784, 0, 0.15);
    tone(988, 0.12, 0.15);
    tone(1319, 0.24, 0.4);
  },
  registered() {
    tone(660, 0, 0.12);
    tone(880, 0.1, 0.12);
    tone(1175, 0.2, 0.3);
  },
  error() {
    tone(220, 0, 0.15, "square", 0.08);
    tone(180, 0.16, 0.25, "square", 0.08);
  },
  title() {
    tone(1047, 0, 0.12, "triangle", 0.12);
    tone(1319, 0.1, 0.12, "triangle", 0.12);
    tone(1568, 0.2, 0.12, "triangle", 0.12);
    tone(2093, 0.3, 0.4, "triangle", 0.1);
  },
  rattle() {
    for (let i = 0; i < 8; i++) noise(i * 0.22, 0.09, 0.14, 1800 + (i % 3) * 700);
  },
  stick() {
    tone(520, 0, 0.08, "triangle", 0.16);
    tone(780, 0.07, 0.12, "triangle", 0.16);
  },
  paper() {
    noise(0, 0.7, 0.07, 3500);
  },
  stamp(rank) {
    tone(110, 0, 0.25, "sine", 0.3);
    if (rank === "大吉" || rank === "中吉") {
      tone(392, 0.05, 0.12);
      tone(523, 0.15, 0.12);
      tone(659, 0.25, 0.12);
      tone(784, 0.35, 0.5);
    } else if (rank === "凶") {
      tone(196, 0.05, 0.3, "sine", 0.2);
      tone(174, 0.3, 0.45, "sine", 0.2);
    } else {
      tone(523, 0.05, 0.14);
      tone(659, 0.18, 0.4);
    }
  }
};

let bgmNode = null;

function startBgm() {
  const b = buffers.bgm;
  if (!b || ac.state !== "running" || bgmNode) return;
  const src = ac.createBufferSource();
  const g = ac.createGain();
  src.buffer = b;
  src.loop = true;
  src.loopStart = Math.min(LOOP_BACK_TO, Math.max(0, b.duration - 1));
  src.loopEnd = Math.max(src.loopStart + 1, b.duration - LOOP_CUT_END);
  src.connect(g);
  g.connect(master);
  const t = ac.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(BGM_VOLUME, t + FADE_IN);
  src.start(t);
  bgmNode = { src, g };
}

function stopBgm() {
  if (!bgmNode) return;
  const { src, g } = bgmNode;
  bgmNode = null;
  const t = ac.currentTime;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(g.gain.value, t);
  g.gain.linearRampToValueAtTime(0, t + FADE_OUT);
  src.stop(t + FADE_OUT + 0.1);
}

let unlocked = false;
async function unlock() {
  if (ac.state !== "running") {
    try { await ac.resume(); } catch (e) {}
  }
  if (ac.state === "running" && !unlocked) {
    unlocked = true;
    hint.textContent = "カードをかざしてください";
    if (state !== "idle") startBgm();
  }
}
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, unlock, { passive: true }));

function tickClock() {
  const t = new Date();
  $("hh").textContent = String(t.getHours()).padStart(2, "0");
  $("mm").textContent = String(t.getMinutes()).padStart(2, "0");
  $("idle-date").textContent = t.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "long" });
}
tickClock();
setInterval(tickClock, 1000);

function splitChars(el, text) {
  el.textContent = "";
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch === " " ? "\u00a0" : ch;
    s.style.setProperty("--i", i);
    el.appendChild(s);
  });
}

function drawQr(url) {
  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  $("r-qr").innerHTML = qr.createSvgTag(6, 0);
}

function countUp(el, to) {
  const start = performance.now();
  const dur = 1400;
  el.textContent = "0";
  const step = (now) => {
    const p = Math.min((now - start) / dur, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function confetti(colors) {
  const box = $("confetti");
  const cs = colors || ["#4f7cff", "#8fb0ff", "#ffb84f", "#ff7a9a", "#5fd0a3"];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("i");
    const w = 5 + Math.random() * 6;
    p.style.left = Math.random() * 100 + "vw";
    p.style.width = w + "px";
    p.style.height = w * 2 + "px";
    p.style.background = cs[i % cs.length];
    p.style.setProperty("--x", (Math.random() * 24 - 12) + "vw");
    p.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    p.style.animationDuration = 2.4 + Math.random() * 1.8 + "s";
    p.style.animationDelay = Math.random() * 0.8 + "s";
    box.appendChild(p);
    setTimeout(() => p.remove(), 6000);
  }
}

const cd = $("cd");
const cdNum = $("cd-num");
let timer = null;
let countdownTimer = null;
let popupTimer = null;
let popupOpen = false;
let omTimers = [];

function roll(el, text) {
  const old = el.querySelector(".r:not(.old)");
  if (old) {
    old.classList.add("old");
    setTimeout(() => old.remove(), 420);
  }
  const n = document.createElement("span");
  n.className = "r";
  n.textContent = text;
  el.appendChild(n);
}

function startCountdown(ms) {
  clearInterval(countdownTimer);
  cdNum.textContent = "";
  const end = Date.now() + ms;
  let last = -1;
  cd.classList.add("on");
  const tick = () => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    if (left !== last) {
      last = left;
      roll(cdNum, String(left));
    }
    cd.classList.toggle("warn", left <= 5);
  };
  tick();
  countdownTimer = setInterval(tick, 200);
}

function clearOm() {
  omTimers.forEach(clearTimeout);
  omTimers = [];
}

function stopTimeouts() {
  clearTimeout(timer);
  clearInterval(countdownTimer);
  timer = null;
  countdownTimer = null;
  clearOm();
  cd.classList.remove("on", "warn");
}

function popup(title, body, done) {
  clearTimeout(popupTimer);
  $("pop-title").textContent = title;
  $("pop-body").textContent = body;
  $("popup").classList.add("on");
  popupOpen = true;
  popupTimer = setTimeout(done, POPUP_MS);
}

function hidePopup() {
  clearTimeout(popupTimer);
  popupTimer = null;
  popupOpen = false;
  $("popup").classList.remove("on");
}

function onTimeout(s) {
  stopTimeouts();
  SFX.timeout();
  popup("タイムアウト", "一定時間操作がなかったため、最初の画面に戻ります", () => request("idle", null, s));
}

async function proceedAfterRegistered() {
  try {
    const r = await fetch(WORKER + "/confirm", { method: "POST" });
    if (!r.ok) throw new Error("confirm");
    timer = setTimeout(() => request("idle", null, "registered"), 8000);
  } catch (e) {
    request("idle", null, "registered");
  }
}

function setTitle(el, text) {
  el.textContent = text;
  el.classList.toggle("none", !text);
}

function later(fn, ms) {
  omTimers.push(setTimeout(fn, ms));
}

function runOmikuji(d) {
  const sc = scenes.omikuji;
  const rank = d.omikuji || "吉";
  const no = Number(d.omikujiNo) || 1;
  const list = MSG[rank] || MSG["吉"];
  sc.classList.remove("shake", "stick", "paper", "result");
  $("o-sub").textContent = d.name + "さん";
  $("o-no").textContent = "第" + no + "番";
  $("o-num").textContent = "第" + no + "番";
  const rk = $("o-rank");
  rk.textContent = rank;
  rk.dataset.rank = rank;
  $("o-msg").textContent = list[no % list.length];
  $("o-lucky").textContent = "今日の問題 : " + LUCKY[(no * 7) % LUCKY.length];
  later(() => { sc.classList.add("shake"); SFX.rattle(); }, 900);
  later(() => { sc.classList.add("stick"); SFX.stick(); }, 3000);
  later(() => { sc.classList.add("paper"); SFX.paper(); }, 4300);
  later(() => {
    sc.classList.add("result");
    SFX.stamp(rank);
    if (GOOD.includes(rank)) confetti(["#ffd24f", "#ffb84f", "#ff9a6b", "#ffe9a8", "#4f7cff"]);
  }, 5400);
  later(() => request("idle", null, "omikuji"), 5400 + TIMEOUT.omikuji);
}

scenes.omikuji.addEventListener("click", () => {
  if (state === "omikuji" && scenes.omikuji.classList.contains("result")) {
    clearOm();
    request("idle", null, "omikuji");
  }
});

let busyEntry = false;

function show(s, d) {
  stopTimeouts();
  hidePopup();
  Object.values(scenes).forEach((el) => el.classList.remove("active"));
  void document.body.offsetWidth;

  if (s === "confirm") {
    busyEntry = false;
    setTitle($("c-title"), titleOf(Number(d.count) || 0));
    splitChars($("c-name"), d.name + "さん");
    btnEntry.disabled = false;
    btnCancel.disabled = false;
  }
  if (s === "register") {
    splitChars($("r-code"), d.code);
    drawQr(d.url);
  }
  if (s === "entered") {
    const count = Number(d.count) || 0;
    const cur = titleOf(count);
    const promoted = !!cur && cur !== titleOf(count - 1);
    const t = new Date(Number(d.at));
    setTitle($("e-title"), cur);
    $("e-title").classList.toggle("promo", promoted);
    $("e-promo").classList.toggle("none", !promoted);
    splitChars($("e-name"), d.name + "さん");
    $("e-date").textContent = t.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
    $("e-time").textContent = t.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    $("e-count").textContent = "0";
    $("e-omi").textContent = d.omikujiNew === "1"
      ? "このあと、今日のおみくじを引きます"
      : "今日のおみくじ　" + (d.omikuji || "");
    later(() => countUp($("e-count"), count), 1250);
    confetti();
    SFX.entry();
    if (promoted) later(() => SFX.title(), 500);
  }
  if (s === "registered") {
    splitChars($("g-name"), d.name + "さん");
    SFX.registered();
  }
  if (s === "omikuji") {
    runOmikuji(d);
  }

  scenes[s].classList.add("active");

  if (s === "confirm" || s === "register") {
    startCountdown(TIMEOUT[s]);
    timer = setTimeout(() => onTimeout(s), TIMEOUT[s]);
  } else if (s === "entered") {
    if (d.omikujiNew === "1") {
      timer = setTimeout(() => request("omikuji", d, "entered"), TIMEOUT.enteredToOmikuji);
    } else {
      timer = setTimeout(() => request("idle", null, s), TIMEOUT.entered);
    }
  } else if (s === "registered") {
    timer = setTimeout(proceedAfterRegistered, TIMEOUT.registered);
  }
}

let busy = false;
let queued = null;

function change(apply) {
  if (busy) {
    queued = apply;
    return;
  }
  busy = true;
  cover.classList.remove("out");
  cover.classList.add("in");
  setTimeout(() => {
    apply();
    cover.classList.remove("in");
    cover.classList.add("out");
    setTimeout(() => {
      cover.classList.remove("out");
      busy = false;
      if (queued) {
        const nx = queued;
        queued = null;
        change(nx);
      }
    }, COVER_MS);
  }, COVER_MS);
}

function request(next, d, from) {
  if (next === "idle" && state === "idle") return;
  const wasIdle = state === "idle";
  state = next;
  if (next === "idle") {
    stopBgm();
    if (from === "confirm" || from === "register") {
      fetch(WORKER + "/cancel", { method: "POST" }).catch(() => {});
    }
  } else if (wasIdle) {
    startBgm();
  }
  change(() => show(next, d));
}

let lastKey = "";
onSnapshot(ref, (snap) => {
  if (!snap.exists()) return;
  const d = snap.data();
  const key = d.state + ":" + d.at;
  if (key === lastKey) return;
  lastKey = key;
  if (Date.now() - Number(d.at) > 20000) return;
  request(d.state, d);
});

async function doEntry() {
  if (state !== "confirm" || busyEntry || popupOpen) return;
  busyEntry = true;
  stopTimeouts();
  SFX.click();
  btnEntry.disabled = true;
  btnCancel.disabled = true;
  try {
    const r = await fetch(WORKER + "/entry", { method: "POST" });
    if (!r.ok) throw new Error("entry failed");
    timer = setTimeout(() => request("idle", null, "confirm"), 8000);
  } catch (e) {
    SFX.error();
    popup("エラー", "エントリーできませんでした。最初の画面に戻ります", () => request("idle", null, "confirm"));
  }
}

function doCancel() {
  if (state !== "confirm" || busyEntry || popupOpen) return;
  stopTimeouts();
  SFX.click();
  request("idle", null, "confirm");
}

btnEntry.addEventListener("click", (e) => {
  e.stopPropagation();
  doEntry();
});
btnCancel.addEventListener("click", (e) => {
  e.stopPropagation();
  doCancel();
});

function press(btn) {
  btn.classList.add("pressed");
  setTimeout(() => btn.classList.remove("pressed"), 150);
}

document.addEventListener("keydown", (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "e") {
    press(btnEntry);
    doEntry();
  } else if (k === "n") {
    press(btnCancel);
    doCancel();
  }
});

if (q.has("test")) {
  $("testPanel").classList.add("on");
  const put = (data) => setDoc(ref, { at: Date.now(), ...data }).catch((err) => alert("書き込みに失敗: " + err.message));
  const bind = (id, fn) => $(id).addEventListener("click", (e) => {
    e.stopPropagation();
    SFX.click();
    fn();
  });
  const rank = () => q.get("rank") || "大吉";
  const no = () => Math.floor(Math.random() * 99) + 1;
  bind("t-confirm", () => put({ state: "confirm", uid: "TEST", name: "テスト", count: 9 }));
  bind("t-register", () => put({ state: "register", uid: "TEST", code: "1234", url: WORKER + "/r?code=1234" }));
  bind("t-entered", () => put({ state: "entered", uid: "TEST", name: "テスト", count: 10, omikuji: rank(), omikujiNo: no(), omikujiNew: "1" }));
  bind("t-entered2", () => put({ state: "entered", uid: "TEST", name: "テスト", count: 42, omikuji: rank(), omikujiNo: no(), omikujiNew: "0" }));
  bind("t-registered", () => put({ state: "registered", uid: "TEST", name: "テスト" }));
  bind("t-morning", () => { document.documentElement.dataset.theme = "morning"; });
  bind("t-night", () => { document.documentElement.dataset.theme = "night"; });
}

document.body.addEventListener("click", async () => {
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
});
