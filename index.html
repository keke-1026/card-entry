<!DOCTYPE html>
<html lang="ja" data-theme="morning">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エントリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&family=Zen+Maru+Gothic:wght@300&display=swap" rel="stylesheet">
<style>
  @property --bg { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
  @property --ink { syntax: "<color>"; inherits: true; initial-value: #1c1f26; }
  @property --mute { syntax: "<color>"; inherits: true; initial-value: #7a8190; }
  @property --line { syntax: "<color>"; inherits: true; initial-value: #e3e6ee; }
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #4f7cff; }
  @property --accent2 { syntax: "<color>"; inherits: true; initial-value: #8fb0ff; }
  :root { --bg: #ffffff; --ink: #1c1f26; --mute: #7a8190; --line: #e3e6ee; --accent: #4f7cff; --accent2: #8fb0ff; --dur: 520ms; --step: 60ms; transition: --bg 2s ease, --ink 2s ease, --mute 2s ease, --line 2s ease, --accent 2s ease, --accent2 2s ease; }
  :root[data-theme="night"] { --bg: #0f1420; --ink: #e9edf7; --mute: #8b94aa; --line: #232b3f; --accent: #7fa2ff; --accent2: #4a67c9; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-weight: 300; font-synthesis: none; }
  button { font: inherit; font-weight: 300; color: inherit; }
  b { font-weight: 300; }

  #bg { position: fixed; inset: 0; background: repeating-linear-gradient(115deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 2px, transparent 2px 64px); animation: drift 40s linear infinite; }
  @keyframes drift { to { background-position: 640px 0; } }

  .scene { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vmin; line-height: 1.3; overflow: hidden; }
  .scene.active { display: flex; }

  .rise { opacity: 0; animation: rise .7s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(3vmin); } to { opacity: 1; transform: none; } }
  .chars span { display: inline-block; opacity: 0; animation: charIn .6s cubic-bezier(.2, .9, .2, 1) forwards; animation-delay: calc(var(--d, 0ms) + var(--i) * 55ms); }
  @keyframes charIn { from { opacity: 0; transform: translateY(60%) scale(.9); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .rule { height: 1px; width: 0; background: var(--ink); margin: 3vmin auto; animation: rule .9s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rule { to { width: 40vmin; } }

  .label { font-size: 3.6vmin; letter-spacing: .5em; padding-left: .5em; color: var(--accent); margin-bottom: 2vmin; }
  .name { font-size: 12vmin; line-height: 1.25; max-width: 92vw; word-break: break-all; }
  .ask { font-size: 5vmin; margin-top: 1vmin; }
  .lbl { font-size: 3vmin; color: var(--mute); margin-top: 1.5vmin; }
  .note { font-size: 3.2vmin; color: var(--mute); margin-top: 3vmin; }

  #idle-date { font-size: 4.2vmin; color: var(--mute); letter-spacing: .2em; }
  #clock { font-size: 22vmin; line-height: 1.1; letter-spacing: .02em; }
  .colon { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .pulse { display: inline-block; font-size: 4vmin; letter-spacing: .2em; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .tapicon { position: relative; width: 22vmin; height: 22vmin; margin: 4vmin 0 3vmin; }
  .reader { position: absolute; left: 0; right: 0; bottom: 0; height: 2.4vmin; border-radius: 1.2vmin; background: var(--ink); }
  .cardico { position: absolute; left: 50%; top: 0; width: 14vmin; height: 9vmin; margin-left: -7vmin; border-radius: 1.4vmin; border: .35vmin solid var(--ink); background: var(--bg); animation: tap 2.8s ease-in-out infinite; }
  .cardico::after { content: ""; position: absolute; left: 1.6vmin; top: 2vmin; width: 4vmin; height: 3vmin; border-radius: .6vmin; background: var(--accent2); }
  @keyframes tap { 0%, 15% { transform: translateY(0) rotate(-6deg); } 45%, 60% { transform: translateY(9vmin) rotate(0deg); } 100% { transform: translateY(0) rotate(-6deg); } }

  .btns { margin-top: 5vmin; display: flex; align-items: center; justify-content: center; }
  .btn { border: 0; cursor: pointer; border-radius: 10vmin; }
  .btn.main { font-size: 5vmin; padding: 2vmin 10vmin; background: var(--ink); color: var(--bg); transition: transform .15s, opacity .3s; animation: glow 2s ease-out infinite; }
  .btn.main:active, .btn.pressed { transform: scale(.95); }
  .btn.main:disabled { opacity: .5; animation: none; }
  .btn.sub { font-size: 3.6vmin; padding: 1.6vmin 6vmin; margin-left: 3vmin; background: transparent; border: 1px solid var(--line); color: var(--mute); transition: transform .15s, opacity .3s; }
  .btn.sub:disabled { opacity: .4; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 4vmin color-mix(in srgb, var(--accent) 0%, transparent); } }

  .nudge { font-size: 6vmin; animation: nudge .6s ease .2s both; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-1.4vmin); } 40% { transform: translateX(1.4vmin); } 60% { transform: translateX(-.8vmin); } 80% { transform: translateX(.8vmin); } }
  .reg { display: flex; gap: 8vmin; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4vmin; }
  .code { font-size: 18vmin; line-height: 1.1; color: var(--accent); }
  .code span { margin: 0 .5vmin; }
  #r-qr { width: 29vmin; height: 29vmin; padding: 2vmin; border: 1px solid var(--line); background: #fff; margin: 0 auto; }
  #r-qr svg { width: 100%; height: 100%; display: block; }

  #s-entered .name { font-size: 11vmin; line-height: 1.2; }
  #s-entered .rule { margin: 2.4vmin auto; }
  #e-date { font-size: 3.6vmin; color: var(--mute); }
  #e-time { font-size: 9vmin; letter-spacing: .05em; margin-top: .6vmin; }
  .total { display: flex; align-items: baseline; justify-content: center; gap: 2vmin; margin-top: 2.4vmin; font-size: 3.8vmin; }
  .total b { font-size: 11vmin; color: var(--accent); min-width: 1ch; }

  .check { width: 16vmin; margin: 3vmin 0; fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .check path { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .7s ease .2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  #today { position: fixed; right: 3.4vmin; top: 50%; width: 34vmin; transform: translateY(-50%); z-index: 10; display: none; }
  body.is-idle #today { display: block; }
  .td-head { display: flex; align-items: baseline; gap: 1.2vmin; padding-left: 2vmin; margin-bottom: 2vmin; font-size: 3vmin; letter-spacing: .3em; color: var(--mute); opacity: 0; animation: rise .7s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: var(--td-base, 700ms); }
  .td-head b { font-size: 5.4vmin; letter-spacing: 0; color: var(--accent); }
  #td-list { list-style: none; margin: 0; padding: 0; }
  #td-list li { display: flex; align-items: baseline; gap: 1.6vmin; margin-bottom: .9vmin; padding: 1.1vmin 1vmin 1.1vmin 2vmin; border-left: .4vmin solid var(--line); font-size: 3.4vmin; opacity: 0; animation: slideIn .8s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--td-base, 700ms) + 200ms + var(--i) * 110ms); }
  #td-list li.latest { border-left-color: var(--accent); color: var(--accent); }
  #td-list li.still { opacity: 1; animation: none; }
  #td-list li.empty, #td-list li.more { color: var(--mute); font-size: 2.8vmin; }
  .td-time { min-width: 6.4vmin; font-size: 2.8vmin; color: var(--mute); font-variant-numeric: tabular-nums; }
  #td-list li.latest .td-time { color: var(--accent); }
  .td-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-n { font-size: 2.8vmin; color: var(--mute); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(16vmin); } to { opacity: 1; transform: none; } }
  @media (min-aspect-ratio: 5/4) { body.today-on #s-idle { padding-right: 40vmin; } }
  @media (max-aspect-ratio: 5/4) {
    #today { top: auto; bottom: 3vmin; left: 3vmin; right: 3vmin; width: auto; transform: none; }
    .td-head { justify-content: center; padding-left: 0; margin-bottom: 1.2vmin; }
    #td-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vmin 1.6vmin; }
    #td-list li { margin: 0; border-left: 0; border-bottom: .3vmin solid var(--line); padding: .6vmin 1.4vmin; font-size: 3vmin; }
    #td-list li.latest { border-bottom-color: var(--accent); }
    .td-time { display: none; }
  }

  #cd { position: fixed; right: 3.4vmin; top: 3vmin; z-index: 20; display: flex; align-items: baseline; gap: 1.2vmin; font-size: 3.2vmin; color: var(--mute); opacity: 0; transform: translateY(-1.5vmin); transition: opacity .4s, transform .4s, color .4s; pointer-events: none; }
  #cd.on { opacity: 1; transform: none; }
  #cd.warn { color: var(--accent); }
  #cd-num { position: relative; display: inline-block; width: 3.4ch; height: 1.25em; overflow: hidden; font-size: 1.6em; line-height: 1.25; font-variant-numeric: tabular-nums; text-align: right; }
  #cd-num .r { position: absolute; left: 0; right: 0; top: 0; animation: rollIn .4s cubic-bezier(.65, 0, .35, 1) both; }
  #cd-num .r.old { animation: rollOut .4s cubic-bezier(.65, 0, .35, 1) both; }
  @keyframes rollIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes rollOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }

  #popup { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(6px); }
  #popup.on { display: flex; animation: fadeIn .25s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .pop-card { min-width: 56vmin; max-width: 88vw; padding: 6.4vmin 8vmin; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 7vmin; box-shadow: 0 2vmin 8vmin rgba(0, 0, 0, .18); font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; animation: popIn .55s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes popIn { from { transform: translateY(4vmin) scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }
  .pop-title { font-size: 6vmin; color: var(--accent); animation: wobble 2.4s ease-in-out .5s infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
  .pop-body { font-size: 3.6vmin; color: var(--mute); margin-top: 2.2vmin; line-height: 1.7; }

  #confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: -5vh; display: block; border-radius: 1px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--x), 112vh, 0) rotate(var(--r)); } }

  #cover { position: fixed; inset: 0; z-index: 50; display: flex; pointer-events: none; }
  #cover .stripe { flex: 1; background: var(--accent); transform: scaleY(0); transform-origin: top; }
  #cover .stripe:nth-child(even) { background: var(--accent2); }
  #cover.in .stripe { animation: coverIn var(--dur) cubic-bezier(.77, 0, .18, 1) forwards; animation-delay: calc(var(--i) * var(--step)); }
  #cover.out .stripe { transform: scaleY(1); transform-origin: bottom; animation: coverOut var(--dur) cubic-bezier(.77, 0, .18, 1) forwards; animation-delay: calc(var(--i) * var(--step)); }
  @keyframes coverIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes coverOut { from { transform: scaleY(1); } to { transform: scaleY(0); } }

  #testPanel { position: fixed; right: 10px; bottom: 14px; z-index: 60; display: none; flex-wrap: wrap; gap: 6px; max-width: 60vw; justify-content: flex-end; }
  #testPanel.on { display: flex; }
  #testPanel button { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
  #dbg { position: fixed; left: 8px; bottom: 8px; z-index: 70; display: none; white-space: pre; font: 12px/1.5 monospace; color: var(--mute); }
  #dbg.on { display: block; }
</style>
</head>
<body class="is-idle">
<div id="bg"></div>

<section class="scene active" id="s-idle">
  <div class="rise" style="--d:0ms"><div id="idle-date"></div></div>
  <div class="rise" style="--d:100ms"><div id="clock"><span id="hh"></span><span class="colon">:</span><span id="mm"></span></div></div>
  <div class="tapicon rise" style="--d:250ms"><div class="reader"></div><div class="cardico"></div></div>
  <div class="rise" style="--d:400ms"><span class="pulse" id="hint">画面をタップしてください!</span></div>
</section>

<section class="scene" id="s-confirm">
  <div class="label rise" style="--d:0ms">ようこそ！</div>
  <div class="name chars" id="c-name" style="--d:120ms"></div>
  <div class="rule" style="--d:460ms"></div>
  <div class="ask rise" style="--d:660ms">エントリーしますか？</div>
  <div class="btns rise" style="--d:840ms">
    <button class="btn main" id="btn-entry">エントリー</button><button class="btn sub" id="btn-cancel">いいえ</button>
  </div>
</section>

<section class="scene" id="s-register">
  <div class="nudge">登録されていないカードです</div>
  <div class="reg">
    <div class="rise" style="--d:300ms">
      <div class="lbl">アクセスコード</div>
      <div class="code chars" id="r-code" style="--d:500ms"></div>
    </div>
    <div class="rise" style="--d:600ms">
      <div id="r-qr"></div>
      <div class="lbl">QRコードを読み取って登録</div>
    </div>
  </div>
  <div class="note rise" style="--d:1000ms">Discordコマンドでは､ 「 /card 」 と 「 アクセスコード 」 で登録もできます</div>
</section>

<section class="scene" id="s-entered">
  <div class="label rise" style="--d:0ms">エントリー完了</div>
  <div class="name chars" id="e-name" style="--d:150ms"></div>
  <div class="rule" style="--d:550ms"></div>
  <div class="rise" style="--d:700ms"><div id="e-date"></div></div>
  <div class="rise" style="--d:850ms"><div id="e-time"></div></div>
  <div class="total rise" style="--d:1050ms"><span>総エントリー数</span><b id="e-count">0</b><span>回</span></div>
</section>

<section class="scene" id="s-registered">
  <div class="label rise" style="--d:0ms">登録完了</div>
  <svg class="check" viewBox="0 0 52 40"><path d="M6 21 L20 35 L46 5"/></svg>
  <div class="name chars" id="g-name" style="--d:400ms"></div>
  <div class="ask rise" style="--d:800ms">登録しました</div>
  <div class="note rise" style="--d:1200ms">続けてエントリーします</div>
</section>

<div id="today">
  <div class="td-head"><span>エントリー</span><b id="td-count">0</b><span>人</span></div>
  <ul id="td-list"></ul>
</div>

<div id="cd"><span>のこり</span><span id="cd-num"></span><span>秒</span></div>
<div id="popup"><div class="pop-card"><div class="pop-title" id="pop-title"></div><div class="pop-body" id="pop-body"></div></div></div>
<div id="confetti"></div>
<div id="cover"></div>
<div id="dbg"></div>

<div id="testPanel">
  <button id="t-confirm">確認</button>
  <button id="t-register">未登録</button>
  <button id="t-entered">完了</button>
  <button id="t-registered">登録</button>
  <button id="t-morning">朝</button>
  <button id="t-night">夜</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, collection, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const q = new URLSearchParams(location.search);
const num = (k, d) => {
  const v = parseFloat(q.get(k));
  return Number.isFinite(v) ? v : d;
};

const CONFIG = {
  worker: "https://entry.keikeiy1026-e69.workers.dev",
  files: { entry: "entry.wav", timeout: "", click: "click.mp3" },
  bgmFiles: ["bgm.wav", "bgm2.wav", "bgm3.wav", "bgm4.wav", "bgm5.wav"],
  bgmVolume: 0.6,
  fadeIn: 1.2,
  fadeOut: 1.6,
  loopStart: 0,
  loopCut: 0,
  xfade: 1.5,
  morningFrom: 6,
  nightFrom: 18,
  timeoutConfirm: 30,
  timeoutRegister: 120,
  enteredHold: 9,
  registeredHold: 2.6,
  popupSec: 2.8,
  coverStripes: 8,
  coverDur: 520,
  coverStep: 60,
  coverHold: 150,
  todayShow: true,
  todayMax: 8
};
const cfg = (k) => (q.has(k) ? num(k, CONFIG[k]) : CONFIG[k]);

const WORKER = CONFIG.worker;
const FILES = CONFIG.files;
const BGM_LIST = CONFIG.bgmFiles.map((x) => (typeof x === "string" ? { file: x } : x));
const BGM_VOLUME = cfg("bgmVolume");
const FADE_IN = cfg("fadeIn");
const FADE_OUT = cfg("fadeOut");
const LOOP_BACK_TO = cfg("loopStart");
const LOOP_CUT_END = cfg("loopCut");
const XFADE = cfg("xfade");
const MORNING_FROM = cfg("morningFrom");
const NIGHT_FROM = cfg("nightFrom");
const TIMEOUT = {
  confirm: (q.has("timeout") ? num("timeout", CONFIG.timeoutConfirm) : CONFIG.timeoutConfirm) * 1000,
  register: (q.has("timeout") ? num("timeout", CONFIG.timeoutRegister) : CONFIG.timeoutRegister) * 1000,
  entered: cfg("enteredHold") * 1000,
  registered: cfg("registeredHold") * 1000
};
const POPUP_MS = cfg("popupSec") * 1000;
const STRIPES = Math.max(2, Math.round(cfg("coverStripes")));
const COVER_DUR = cfg("coverDur");
const COVER_STEP = cfg("coverStep");
const COVER_HOLD = cfg("coverHold");
const COVER_MS = COVER_DUR + (STRIPES - 1) * COVER_STEP + 40;
document.documentElement.style.setProperty("--dur", COVER_DUR + "ms");
document.documentElement.style.setProperty("--step", COVER_STEP + "ms");
const TODAY_MAX = Math.max(1, Math.round(cfg("todayMax")));
const TODAY_ON = q.has("today") ? num("today", 1) !== 0 : CONFIG.todayShow;
document.documentElement.style.setProperty("--td-base", Math.round(COVER_HOLD + COVER_DUR * 0.9) + "ms");
if (TODAY_ON) document.body.classList.add("today-on");

const app = initializeApp({
  apiKey: "AIzaSyBjQWOa8y2UWgL81HvmEv_yiTCtTbk4cxU",
  authDomain: "keke-dev.firebaseapp.com",
  projectId: "keke-dev"
});
const db = getFirestore(app);
const ref = doc(db, "checkin-display", "latest");

const $ = (id) => document.getElementById(id);
const scenes = {
  idle: $("s-idle"),
  confirm: $("s-confirm"),
  register: $("s-register"),
  entered: $("s-entered"),
  registered: $("s-registered")
};
const cover = $("cover");
const hint = $("hint");
const btnEntry = $("btn-entry");
const btnCancel = $("btn-cancel");
let state = "idle";
let lastDoc = null;

for (let i = 0; i < STRIPES; i++) {
  const s = document.createElement("div");
  s.className = "stripe";
  s.style.setProperty("--i", i);
  cover.appendChild(s);
}

function themeOf(h) {
  return h >= MORNING_FROM && h < NIGHT_FROM ? "morning" : "night";
}
function applyTheme() {
  document.documentElement.dataset.theme = q.get("theme") || themeOf(new Date().getHours());
}
applyTheme();
setInterval(applyTheme, 30000);

const AC = window.AudioContext || window.webkitAudioContext;
const ac = new AC();
const master = ac.createGain();
master.gain.value = 1;
master.connect(ac.destination);
const buffers = {};

async function loadBuffer(url) {
  if (!url) return null;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await ac.decodeAudioData(await r.arrayBuffer());
  } catch (e) {
    return null;
  }
}
Object.entries(FILES).forEach(async ([k, u]) => {
  buffers[k] = await loadBuffer(u);
});

const bgmTracks = [];
BGM_LIST.forEach(async (t) => {
  const buf = await loadBuffer(t.file);
  if (buf) bgmTracks.push({ ...t, buf });
});
let lastBgmFile = "";
let currentBgm = "";

function pickBgm() {
  if (!bgmTracks.length) return null;
  const pool = bgmTracks.length > 1 ? bgmTracks.filter((t) => t.file !== lastBgmFile) : bgmTracks;
  const t = pool[Math.floor(Math.random() * pool.length)];
  lastBgmFile = t.file;
  return t;
}

function tone(freq, start, dur, type = "sine", vol = 0.18) {
  const t = ac.currentTime + start;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function playBuf(name) {
  const b = buffers[name];
  if (!b) return false;
  const s = ac.createBufferSource();
  s.buffer = b;
  s.connect(master);
  s.start();
  return true;
}

const SFX = {
  click() { if (!playBuf("click")) tone(880, 0, 0.07, "triangle", 0.14); },
  timeout() {
    if (playBuf("timeout")) return;
    tone(660, 0, 0.16, "sine", 0.16);
    tone(523, 0.18, 0.16, "sine", 0.16);
    tone(440, 0.36, 0.3, "sine", 0.16);
  },
  entry() {
    if (playBuf("entry")) return;
    tone(784, 0, 0.15);
    tone(988, 0.12, 0.15);
    tone(1319, 0.24, 0.4);
  },
  registered() {
    tone(660, 0, 0.12);
    tone(880, 0.1, 0.12);
    tone(1175, 0.2, 0.3);
  },
  error() {
    tone(330, 0, 0.15, "sine", 0.14);
    tone(262, 0.18, 0.3, "sine", 0.14);
  }
};

const curveIn = new Float32Array(64);
const curveOut = new Float32Array(64);
for (let i = 0; i < 64; i++) {
  const x = i / 63;
  curveIn[i] = Math.sin(x * Math.PI / 2);
  curveOut[i] = Math.cos(x * Math.PI / 2);
}
let bgmRun = null;

function startBgm() {
  if (ac.state !== "running" || bgmRun) return;
  const track = pickBgm();
  if (!track) return;
  const b = track.buf;
  const loopBack = track.loopStart ?? LOOP_BACK_TO;
  const loopCut = track.loopCut ?? LOOP_CUT_END;
  const xfade = track.xfade ?? XFADE;
  const volume = track.volume ?? BGM_VOLUME;
  currentBgm = track.file;
  const loopStart = Math.min(Math.max(0, loopBack), Math.max(0, b.duration - 2));
  const loopEnd = Math.max(loopStart + 1, b.duration - Math.max(0, loopCut));
  const xf = Math.min(Math.max(0.02, xfade), Math.max(0.02, (loopEnd - loopStart - 0.5) / 2));
  const bus = ac.createGain();
  bus.connect(master);
  const t0 = ac.currentTime;
  bus.gain.setValueAtTime(0, t0);
  bus.gain.linearRampToValueAtTime(volume, t0 + FADE_IN);
  const run = { bus, alive: true, timer: null, voices: [] };
  bgmRun = run;

  const spawn = (at, offset, first) => {
    if (!run.alive) return;
    const src = ac.createBufferSource();
    const g = ac.createGain();
    const len = loopEnd - offset;
    src.buffer = b;
    src.connect(g);
    g.connect(bus);
    if (!first) g.gain.setValueCurveAtTime(curveIn, at, xf);
    g.gain.setValueCurveAtTime(curveOut, at + len - xf, xf);
    src.onended = () => { run.voices = run.voices.filter((v) => v !== src); };
    src.start(at, offset);
    src.stop(at + len + 0.05);
    run.voices.push(src);
    const nextAt = at + len - xf;
    const wait = Math.max(0, (nextAt - ac.currentTime - 1) * 1000);
    run.timer = setTimeout(() => spawn(nextAt, loopStart, false), wait);
  };
  spawn(t0, 0, true);
}

function stopBgm() {
  if (!bgmRun) return;
  const run = bgmRun;
  bgmRun = null;
  run.alive = false;
  clearTimeout(run.timer);
  const t = ac.currentTime;
  const p = run.bus.gain;
  if (p.cancelAndHoldAtTime) {
    p.cancelAndHoldAtTime(t);
  } else {
    p.cancelScheduledValues(t);
    p.setValueAtTime(p.value, t);
  }
  p.linearRampToValueAtTime(0, t + FADE_OUT);
  run.voices.forEach((v) => {
    try { v.stop(t + FADE_OUT + 0.1); } catch (e) {}
  });
  setTimeout(() => {
    try { run.bus.disconnect(); } catch (e) {}
  }, (FADE_OUT + 0.4) * 1000);
}

let unlocked = false;
async function unlock() {
  if (ac.state !== "running") {
    try { await ac.resume(); } catch (e) {}
  }
  if (ac.state === "running" && !unlocked) {
    unlocked = true;
    hint.textContent = "カードをかざしてください";
    if (state !== "idle") startBgm();
  }
}
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, unlock, { passive: true }));

function tickClock() {
  const t = new Date();
  $("hh").textContent = String(t.getHours()).padStart(2, "0");
  $("mm").textContent = String(t.getMinutes()).padStart(2, "0");
  $("idle-date").textContent = t.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "long" });
}
tickClock();
setInterval(tickClock, 1000);

function splitChars(el, text) {
  el.textContent = "";
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch === " " ? "\u00a0" : ch;
    s.style.setProperty("--i", i);
    el.appendChild(s);
  });
}

function drawQr(url) {
  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  $("r-qr").innerHTML = qr.createSvgTag(6, 0);
}

function countUp(el, to) {
  const start = performance.now();
  const dur = 1400;
  el.textContent = "0";
  const step = (now) => {
    const p = Math.min((now - start) / dur, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function confetti(colors) {
  const box = $("confetti");
  const cs = colors || ["#4f7cff", "#8fb0ff", "#ffb84f", "#ff7a9a", "#5fd0a3"];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("i");
    const w = 5 + Math.random() * 6;
    p.style.left = Math.random() * 100 + "vw";
    p.style.width = w + "px";
    p.style.height = w * 2 + "px";
    p.style.background = cs[i % cs.length];
    p.style.setProperty("--x", (Math.random() * 24 - 12) + "vw");
    p.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    p.style.animationDuration = 2.4 + Math.random() * 1.8 + "s";
    p.style.animationDelay = Math.random() * 0.8 + "s";
    box.appendChild(p);
    setTimeout(() => p.remove(), 6000);
  }
}

const cd = $("cd");
const cdNum = $("cd-num");
let timer = null;
let countdownTimer = null;
let popupTimer = null;
let popupOpen = false;
let laterTimers = [];

function roll(el, text) {
  const old = el.querySelector(".r:not(.old)");
  if (old) {
    old.classList.add("old");
    setTimeout(() => old.remove(), 420);
  }
  const n = document.createElement("span");
  n.className = "r";
  n.textContent = text;
  el.appendChild(n);
}

function startCountdown(ms) {
  clearInterval(countdownTimer);
  cdNum.textContent = "";
  const end = Date.now() + ms;
  let last = -1;
  cd.classList.add("on");
  const tick = () => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    if (left !== last) {
      last = left;
      roll(cdNum, String(left));
    }
    cd.classList.toggle("warn", left <= 5);
  };
  tick();
  countdownTimer = setInterval(tick, 200);
}

function later(fn, ms) {
  laterTimers.push(setTimeout(fn, ms));
}

function stopTimeouts() {
  clearTimeout(timer);
  clearInterval(countdownTimer);
  timer = null;
  countdownTimer = null;
  laterTimers.forEach(clearTimeout);
  laterTimers = [];
  cd.classList.remove("on", "warn");
}

function popup(title, body, done) {
  clearTimeout(popupTimer);
  $("pop-title").textContent = title;
  $("pop-body").textContent = body;
  $("popup").classList.add("on");
  popupOpen = true;
  popupTimer = setTimeout(done, POPUP_MS);
}

function hidePopup() {
  clearTimeout(popupTimer);
  popupTimer = null;
  popupOpen = false;
  $("popup").classList.remove("on");
}

function onTimeout(s) {
  stopTimeouts();
  SFX.timeout();
  popup("あれれ、時間切れです", "しばらく操作がなかったので、最初の画面にもどりますね", () => request("idle", null, s));
}

async function proceedAfterRegistered() {
  try {
    const r = await fetch(WORKER + "/confirm", { method: "POST" });
    if (!r.ok) throw new Error("confirm");
    timer = setTimeout(() => request("idle", null, "registered"), 8000);
  } catch (e) {
    request("idle", null, "registered");
  }
}

function afterEntry(d) {
  later(() => countUp($("e-count"), Number(d.count) || 0), 1050);
  confetti();
  SFX.entry();
}

let today = [];
let todayError = "";
let todaySig = "";
let shownKeys = new Set();
let unsubToday = null;
let todayDay = "";
const FAKE_NAMES = ["たろう", "はなこ", "けけ", "ゆうき", "みお", "そら", "りん", "あおい", "ひなた", "れん"];

function dayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function todayRow(cls, text, idx, still) {
  const li = document.createElement("li");
  li.className = cls + (still ? " still" : "");
  li.style.setProperty("--i", idx);
  li.textContent = text;
  return li;
}

function renderToday(replay) {
  if (!TODAY_ON) return;
  const list = $("td-list");
  const still = !replay;
  if (replay) shownKeys = new Set();
  list.textContent = "";
  $("td-count").textContent = String(today.length);
  if (todayError) {
    list.appendChild(todayRow("empty", "一覧を読み込めません", 0, still));
    return;
  }
  if (!today.length) {
    list.appendChild(todayRow("empty", "まだ誰もいません", 0, still));
    return;
  }
  const shown = today.slice(0, TODAY_MAX);
  let order = 0;
  shown.forEach((p, i) => {
    const key = p.uid + ":" + p.last;
    const seen = shownKeys.has(key);
    const li = document.createElement("li");
    const t = document.createElement("span");
    const n = document.createElement("span");
    shownKeys.add(key);
    li.style.setProperty("--i", replay ? i : order);
    if (!replay && seen) li.classList.add("still");
    if (!replay && !seen) order += 1;
    if (i === 0) li.classList.add("latest");
    t.className = "td-time";
    t.textContent = new Date(p.last).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    n.className = "td-name";
    n.textContent = p.name;
    li.append(t, n);
    if (p.n > 1) {
      const c = document.createElement("span");
      c.className = "td-n";
      c.textContent = "×" + p.n;
      li.appendChild(c);
    }
    list.appendChild(li);
  });
  if (today.length > shown.length) {
    list.appendChild(todayRow("more", "ほか " + (today.length - shown.length) + "人", shown.length, still));
  }
}

function applyToday(next) {
  const sig = JSON.stringify(next.map((p) => [p.uid, p.last, p.n, p.name])) + "|" + todayError;
  today = next;
  if (sig === todaySig) return;
  todaySig = sig;
  if (state === "idle") renderToday(false);
}

function subscribeToday() {
  if (!TODAY_ON) return;
  if (unsubToday) {
    unsubToday();
    unsubToday = null;
  }
  todayDay = dayKey();
  todayError = "";
  if (q.has("fake")) {
    const cnt = Math.min(Math.max(0, Math.round(num("fake", 5))), FAKE_NAMES.length);
    const now = Date.now();
    applyToday(FAKE_NAMES.slice(0, cnt).map((name, i) => {
      const at = now - (i + 1) * 900000;
      return { uid: "fake" + i, name, first: at, last: at, n: i === 1 ? 2 : 1 };
    }));
    return;
  }
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  const qy = query(collection(db, "checkin-log"), where("at", ">=", start.getTime()), orderBy("at", "asc"));
  unsubToday = onSnapshot(qy, (snap) => {
    if (snap.metadata.fromCache && snap.empty) return;
    todayError = "";
    const map = new Map();
    snap.forEach((docSnap) => {
      const x = docSnap.data();
      const key = x.uid || docSnap.id;
      const at = Number(x.at);
      const cur = map.get(key);
      if (!cur) {
        map.set(key, { uid: key, name: x.name, first: at, last: at, n: 1 });
      } else {
        cur.last = at;
        cur.n += 1;
        cur.name = x.name;
      }
    });
    applyToday([...map.values()].sort((a, b) => b.last - a.last));
  }, (err) => {
    todayError = err && err.code ? err.code : "error";
    console.error(err);
    applyToday([]);
  });
}
subscribeToday();
setInterval(() => {
  if (dayKey() !== todayDay) subscribeToday();
}, 30000);

let busyEntry = false;

function show(s, d) {
  stopTimeouts();
  hidePopup();
  Object.values(scenes).forEach((el) => el.classList.remove("active"));
  void document.body.offsetWidth;
  document.body.classList.toggle("is-idle", s === "idle");
  if (s === "idle") renderToday(true);

  if (s === "confirm") {
    busyEntry = false;
    splitChars($("c-name"), d.name + "さん");
    btnEntry.disabled = false;
    btnCancel.disabled = false;
  }
  if (s === "register") {
    splitChars($("r-code"), d.code);
    drawQr(d.url);
  }
  if (s === "entered") {
    const t = new Date(Number(d.at));
    splitChars($("e-name"), d.name + "さん");
    $("e-date").textContent = t.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
    $("e-time").textContent = t.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    $("e-count").textContent = "0";
    afterEntry(d);
  }
  if (s === "registered") {
    splitChars($("g-name"), d.name + "さん");
    SFX.registered();
  }

  scenes[s].classList.add("active");

  if (s === "confirm" || s === "register") {
    startCountdown(TIMEOUT[s]);
    timer = setTimeout(() => onTimeout(s), TIMEOUT[s]);
  } else if (s === "entered") {
    timer = setTimeout(() => request("idle", null, s), TIMEOUT.entered);
  } else if (s === "registered") {
    timer = setTimeout(proceedAfterRegistered, TIMEOUT.registered);
  }
}

let busy = false;
let queued = null;

function change(apply) {
  if (busy) {
    queued = apply;
    return;
  }
  busy = true;
  cover.classList.remove("out");
  cover.classList.add("in");
  setTimeout(() => {
    apply();
    setTimeout(() => {
      cover.classList.remove("in");
      cover.classList.add("out");
      setTimeout(() => {
        cover.classList.remove("out");
        busy = false;
        if (queued) {
          const nx = queued;
          queued = null;
          change(nx);
        }
      }, COVER_MS);
    }, COVER_HOLD);
  }, COVER_MS);
}

function request(next, d, from) {
  if (next === "idle" && state === "idle") return;
  const wasIdle = state === "idle";
  state = next;
  if (next === "idle") {
    stopBgm();
    if (from === "confirm" || from === "register") {
      fetch(WORKER + "/cancel", { method: "POST" }).catch(() => {});
    }
  } else if (wasIdle) {
    startBgm();
  }
  change(() => show(next, d));
}

let lastKey = "";
onSnapshot(ref, (snap) => {
  if (!snap.exists()) return;
  const d = snap.data();
  lastDoc = d;
  const key = d.state + ":" + d.at;
  if (key === lastKey) return;
  lastKey = key;
  if (Date.now() - Number(d.at) > 20000) return;
  request(d.state, d);
});

async function doEntry() {
  if (state !== "confirm" || busyEntry || popupOpen) return;
  busyEntry = true;
  stopTimeouts();
  SFX.click();
  btnEntry.disabled = true;
  btnCancel.disabled = true;
  try {
    const r = await fetch(WORKER + "/entry", { method: "POST" });
    if (!r.ok) throw new Error("entry failed");
    timer = setTimeout(() => request("idle", null, "confirm"), 8000);
  } catch (e) {
    SFX.error();
    popup("ごめんなさい", "うまくいきませんでした。最初の画面にもどりますね", () => request("idle", null, "confirm"));
  }
}

function doCancel() {
  if (state !== "confirm" || busyEntry || popupOpen) return;
  stopTimeouts();
  SFX.click();
  request("idle", null, "confirm");
}

btnEntry.addEventListener("click", (e) => {
  e.stopPropagation();
  doEntry();
});
btnCancel.addEventListener("click", (e) => {
  e.stopPropagation();
  doCancel();
});

function press(btn) {
  btn.classList.add("pressed");
  setTimeout(() => btn.classList.remove("pressed"), 150);
}

document.addEventListener("keydown", (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "e") {
    press(btnEntry);
    doEntry();
  } else if (k === "n") {
    press(btnCancel);
    doCancel();
  }
});

if (q.has("debug")) {
  const dbg = $("dbg");
  dbg.classList.add("on");
  setInterval(() => {
    const d = lastDoc || {};
    dbg.textContent =
      "画面: " + state + "\n" +
      "受信: " + (d.state || "-") + "\n" +
      "UID: " + (d.uid || "-") + "\n" +
      "音: " + ac.state + " / BGM " + (bgmRun ? "再生中 " + currentBgm : "停止") + "\n" +
      "一覧: " + today.length + "人" + (todayError ? " / エラー " + todayError : "") + "\n" +
      "テーマ: " + document.documentElement.dataset.theme;
  }, 500);
}

if (q.has("test")) {
  $("testPanel").classList.add("on");
  const put = (data) => setDoc(ref, { at: Date.now(), ...data }).catch((err) => alert("書き込みに失敗: " + err.message));
  const bind = (id, fn) => $(id).addEventListener("click", (e) => {
    e.stopPropagation();
    SFX.click();
    fn();
  });
  bind("t-confirm", () => put({ state: "confirm", uid: "TEST", name: "テスト", count: 9 }));
  bind("t-register", () => put({ state: "register", uid: "TEST", code: "1234", url: WORKER + "/r?code=1234" }));
  bind("t-entered", () => put({ state: "entered", uid: "TEST", name: "テスト", count: 10 }));
  bind("t-registered", () => put({ state: "registered", uid: "TEST", name: "テスト" }));
  bind("t-morning", () => { document.documentElement.dataset.theme = "morning"; });
  bind("t-night", () => { document.documentElement.dataset.theme = "night"; });
}

document.body.addEventListener("click", async () => {
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
});
</script>
